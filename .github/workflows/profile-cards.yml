name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate public GitHub statistics
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=manenim&show_icons=true&hide_rank=true&theme=github_dark&hide_border=true&custom_title=Public%20GitHub%20Activity
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: "2.1.3"
          fail_on_error: "true"
      - name: Generate public repository language breakdown
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=manenim&layout=compact&langs_count=5&theme=github_dark&hide_border=true
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: "2.1.3"
          fail_on_error: "true"
      - name: Cache contribution streak
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET
          target = Path("profile/streak.svg")
          url = "https://streak-stats.demolab.com/?user=manenim&theme=github-dark-blue&hide_border=true"
          try:
              request = Request(url, headers={"User-Agent": "manenim-profile-cards"})
              with urlopen(request, timeout=30) as response:
                  data = response.read()
              root = ET.fromstring(data)
              if root.tag != "{http://www.w3.org/2000/svg}svg":
                  raise ValueError("Expected an SVG")
              text = " ".join(root.itertext()).lower()
              if "current streak" not in text or "longest streak" not in text:
                  raise ValueError("Streak service did not return a complete card")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          except Exception as error:
              if not target.exists():
                  raise
              print(f"Keeping previous streak card: {type(error).__name__}")
          PY
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/languages.svg profile/streak.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh profile activity cards"
          git push
